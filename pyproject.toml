[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hitl-agent-queue"
version = "0.1.0"
description = "Human-in-the-loop work queue for coordinating coding agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Matt Reichenbach" }]
dependencies = []

[project.optional-dependencies]
dev = []
app = ["pywebview>=5"]

[project.scripts]
hitl-queue = "hitl_queue.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hitl_queue = ["app.html"]
