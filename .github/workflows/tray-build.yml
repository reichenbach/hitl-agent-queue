name: Tray builds

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Linux tray dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libappindicator3-dev gir1.2-appindicator3-0.1 python3-gi
      - name: Install build dependencies
        run: python -m pip install -e ".[tray]" pyinstaller
      - name: Build
        run: pyinstaller --noconfirm --clean packaging/hitl_tray.spec
      - uses: actions/upload-artifact@v4
        with:
          name: hitl-tray-${{ runner.os }}
          path: |
            dist/HITL Tray.app
            dist/HITL Tray
            dist/HITL Tray.exe
          if-no-files-found: error
