name: Tray builds

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install Linux tray dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libappindicator3-dev gir1.2-appindicator3-0.1 python3-gi
      - name: Install build dependencies
        run: python -m pip install -e ".[tray]" pyinstaller
      - name: Build
        run: pyinstaller --noconfirm --clean packaging/hitl_tray.spec
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hitl-tray-${{ runner.os }}
          path: |
            dist/HITL Tray.app
            dist/HITL Tray
            dist/HITL Tray.exe
          if-no-files-found: error
